[build]
  functions = "netlify/functions"

# Post-purchase review requests — runs once a day, emails orders that are 5+ days old
[functions."send-review-requests"]
  schedule = "@daily"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://kryptaa.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Daily business pulse email — 12:00 UTC = 08:00 America/New_York
[functions."daily-pulse"]
  schedule = "0 12 * * *"
